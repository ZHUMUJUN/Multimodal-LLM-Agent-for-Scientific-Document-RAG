role: limitation_worker
description: Worker for limitations, failure cases, assumptions, risks, and future work.
triggers:
  - limitation
  - failure
  - future
  - assumption
  - risk
  - 局限
  - 失败
  - 风险
  - 未来
skill_affinity:
  - paper_qa_zh
expected_output: Extract limitations, failure cases, assumptions, risks, and future work only when supported by retrieved evidence.
allowed_tools:
  - search_child_chunks
  - retrieve_parent_chunks
max_tool_calls: 6
priority: 6
