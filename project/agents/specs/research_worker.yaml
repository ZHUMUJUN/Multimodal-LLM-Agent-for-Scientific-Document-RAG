role: research_worker
description: General evidence-grounded research worker for open-ended RAG questions.
triggers:
  - summarize
  - explain
  - answer
  - overview
  - 总结
  - 解释
skill_affinity:
  - paper_qa_zh
default_for_skills:
  - paper_qa_zh
expected_output: Answer the assigned question using retrieved evidence, cite concrete source snippets when available, and mark unknowns explicitly.
allowed_tools:
  - search_child_chunks
  - retrieve_parent_chunks
  - search_figures
max_tool_calls: 6
priority: 1
